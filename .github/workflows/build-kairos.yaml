---
name: Build Kairos Images

on:
  push:
    branches:
      - main
      - renovate/**
    paths:
      - "images/**"
      - "!README.md"
      - "!.github/workflows/*.yaml"
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
    paths:
      - "images/**"
      - "!README.md"
      - "!.github/workflows/*.yaml"
concurrency:
  cancel-in-progress: true
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

env:
  REGISTRY: ghcr.io

jobs:
  build-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      max-parallel: 1
      matrix:
        distro:
          - almalinux10
          - hadron0

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute distro and major version
        id: distro_version
        run: |-
          distro=$(echo ${{matrix.distro}} | grep -oE '[a-zA-Z]+')
          distro_major_version=$(echo ${{matrix.distro}} | grep -oE '[0-9]+')
          # shellcheck disable=SC2129
          echo "distro=${distro}" >> "$GITHUB_OUTPUT"
          echo "distro_major_version=${distro_major_version}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: images/${{ steps.distro_version.outputs.distro }}
          file:
            images/${{ steps.distro_version.outputs.distro }}/Dockerfile.${{
            steps.distro_version.outputs.distro_major_version }}
          push: false
          tags: latest
          build-args: |
            "VERSION=0.0.0-dev"
