---
name: Linting

on:
  push:
    branches:
      - main
      - renovate/**
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize

concurrency:
  cancel-in-progress: true
  group: >-
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}

jobs:
  linting:
    runs-on: ubuntu-latest
    steps:
      - uses: ucl-arc-environments/.github/actions/linting@582ab7ba76dbb0c8c8496097c9afc7bcab70a0ac # v0.15.0
        with:
          pre-commit-config: ./.pre-commit-config.yaml
