---
name: Publish Kairos images

# Releases tagged images/vX.Y.Z build every distro in the matrix together.
on:
  release:
    types:
      - prereleased
      - released

env:
  REGISTRY: ghcr.io

jobs:
  release-scope:
    if: startsWith(github.event.release.tag_name, 'images/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Check for changes and update release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: |-
          if [[ ! "${TAG#images/}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '${TAG}' must be of the form images/vX.Y.Z[-prerelease]"
            exit 1
          fi
          .github/scripts/release-scope.sh "${TAG}" 'images/v*' \
            images/ .github/workflows/publish-kairos.yaml

  build-and-push-image:
    needs: release-scope
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      max-parallel: 1
      matrix:
        distro:
          - almalinux10
          - hadron0
        k3s_version:
          # renovate: datasource=custom.k3s-minor-2 depName=k3s_build
          - v1.34.12+k3s1
          # renovate: datasource=custom.k3s-minor-1 depName=k3s_build
          - v1.35.9+k3s1
          # renovate: datasource=custom.k3s-minor-0 depName=k3s_build
          - v1.36.5+k3s1

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        if: ${{ !env.ACT }}
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags and versions
        id: versions
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
          MATRIX_DISTRO: ${{ matrix.distro }}
          K3S_VERSION: ${{ matrix.k3s_version }}
        run: |-
          # images/v1.2.3 -> 1.2.3
          version="${TAG#images/v}"

          # strip numbers and letters from distro to get the name and major version
          distro=$(echo "${MATRIX_DISTRO}" | grep -oE '[a-zA-Z]+')
          distro_major_version=$(echo "${MATRIX_DISTRO}" | grep -oE '[0-9]+')
          dockerfile="images/${distro}/Dockerfile.${distro_major_version}"
          if [ ! -f "${dockerfile}" ]; then
            echo "::error::Dockerfile not found at ${dockerfile}"
            exit 1
          fi

          image_name="${REGISTRY}/ucl-arc-environments/kairos-${distro}"
          short_tag="${distro_major_version}-k3s${K3S_VERSION}-${version}"
          image_tags="${image_name}:${short_tag//+/-}"

          if [ "${PRERELEASE}" != "true" ]; then
            # get the kairos-init version from the Dockerfile
            kairos_init_version="$(grep "^FROM quay.io/kairos/kairos-init:" "${dockerfile}" \
            | cut -d':' -f2 | awk -F '[@]' '{print $1}')"
            if [ -z "${kairos_init_version}" ]; then
              echo "::error::Could not parse the kairos-init version from ${dockerfile}"
              exit 1
            fi
            kairos_tag="${distro_major_version}-standard-amd64-generic-${kairos_init_version}-k3s${K3S_VERSION}"
            image_tags="${image_tags},${image_name}:${kairos_tag//+/-}"
          fi

          # shellcheck disable=SC2129
          echo "distro=${distro}" >> "$GITHUB_OUTPUT"
          echo "dockerfile=${dockerfile}" >> "$GITHUB_OUTPUT"
          echo "image_name=${image_name}" >> "$GITHUB_OUTPUT"
          echo "kairos_version=${version}-${MATRIX_DISTRO}" >> "$GITHUB_OUTPUT"
          echo "image_tags=${image_tags}" >> "$GITHUB_OUTPUT"

      - name: Extract tags and labels
        id: meta
        if: ${{ !env.ACT }}
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ steps.versions.outputs.image_name }}

      - name: Build and push image
        if: ${{ !env.ACT }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: images/${{ steps.versions.outputs.distro }}
          file: ${{ steps.versions.outputs.dockerfile }}
          push: true
          tags: ${{ steps.versions.outputs.image_tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            "VERSION=${{ steps.versions.outputs.kairos_version }}"
            "KUBERNETES_VERSION=${{ matrix.k3s_version }}"
